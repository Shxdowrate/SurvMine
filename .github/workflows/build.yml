name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --console=plain > build.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          grep -E "error:|warning:|FAIL|BUILD|Exception" build.log | head -n 600
          tail -n 40 build.log
      - name: API signatures (dev reference)
        if: hashFiles('.ci/javap.txt') != ''
        run: |
          JAR=$(find ~/.gradle .gradle -name 'minecraft-*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'merged|common|clientOnly|client' | head -n 5 | tr '\n' ':')
          echo "classpath: $JAR"
          if [ -f .ci/find.txt ]; then
            for j in $(echo "$JAR" | tr ':' ' '); do unzip -Z1 "$j" | grep '\.class$' | grep -v '\$' > classes_$(basename "$j").txt; done
            grep -v '^\s*$' .ci/find.txt | while read -r p; do echo "== find $p"; cat classes_*.txt | grep -E "$p" | head -n 40; done
          fi
          grep -v '^#' .ci/javap.txt | grep -v '^\s*$' | while read -r c; do javap -protected -cp "$JAR" "$c" 2>&1 | grep -v "^Compiled from" ; done
      - name: Release jar
        if: steps.build.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/survmine-*.jar | grep -v sources | head -n1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" -t "SurvMine (последняя сборка)" -n "Автосборка из ${{ github.sha }}" --latest
      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
