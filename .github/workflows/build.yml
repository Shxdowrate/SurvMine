name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --console=plain > build.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -n 80 build.log
      - name: Publish build log to ci-log branch
        if: always()
        run: |
          mkdir -p logout
          cp build.log logout/ 2>/dev/null || echo "no log" > logout/build.log
          echo "${{ steps.build.outputs.code }} ${{ github.sha }}" > logout/status.txt
          cd logout && git init -q && git checkout -q -b ci-log && git add . && git -c user.name=ci -c user.email=ci@local commit -qm log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
      - name: Release jar
        if: steps.build.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/survmine-*.jar | grep -v sources | head -n1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" -t "SurvMine (последняя сборка)" -n "Автосборка из ${{ github.sha }}" --latest
      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
